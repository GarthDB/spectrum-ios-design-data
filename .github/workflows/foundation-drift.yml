# Catches the foundation moving between PRs (validate.yml only checks drift
# when someone opens a PR here). Weekly + manual; opens a de-duped
# "Foundation moved" issue when the pinned foundationVersion lags latest.
name: Foundation drift

on:
  schedule:
    - cron: "0 14 * * 1" # weekly, Monday 14:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # required for open-issue
    steps:
      - uses: actions/checkout@v4
      - uses: adobe/spectrum-design-data/.github/actions/validate@0f3e37f72d2132776f016c8bd405da0ef51605c9
        with:
          dataset-path: .
          manifest: manifest.json
          skip-dataset-validation: "true"
          drift-mode: warn
          open-issue: "true"
